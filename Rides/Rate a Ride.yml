info:
  name: Rate a Ride
  type: http
  seq: 6
  tags:
    - Rides

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rides/:id/rate"
  params:
    - name: id
      value: ""
      type: path
      description: UUID of the ride
  body:
    type: json
    data: |-
      {
        "score": 5,
        "comment": "Smooth and fast driving!"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Ride rated successfully
    request:
      url: "{{baseUrl}}/api/v1/rides/:id/rate"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: UUID of the ride
      body:
        type: json
        data: |-
          {
            "score": 5,
            "comment": "Smooth and fast driving!"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "ride_id": "",
              "score": 5,
              "comment": "Great ride!"
            }
          }

docs: Submits rating score and optional text comment for a completed ride.

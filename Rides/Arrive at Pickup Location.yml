  type: http
  seq: 8
  tags:
    - Rides

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rides/:id/arrived"
  params:
    - name: id
      value: ""
      type: path
      description: UUID of the ride
  auth:
    type: bearer
    token: "{{token}}"

settings:

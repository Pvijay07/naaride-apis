info:
  name: Cancel a Ride
  type: http
  seq: 5
  tags:
    - Rides

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rides/:id/cancel"
  params:
    - name: id
      value: ""
      type: path
      description: UUID of the ride to cancel
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Ride cancelled successfully
    request:
      url: "{{baseUrl}}/api/v1/rides/:id/cancel"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: UUID of the ride to cancel
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "",
              "status": "cancelled",
              "cancellation_fee": 20
            }
          }

docs: Cancels an active or requested ride. A cancellation fee might apply.

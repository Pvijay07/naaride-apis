info:
  name: Verify OTP
  type: http
  seq: 2
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/otp/verify"
  body:
    type: json
    data: |-
      {
        "phone": "+919876543210",
        "role": "rider",
        "otp": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Verification successful, returns token pair
    request:
      url: "{{baseUrl}}/api/v1/auth/otp/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "phone": "+919876543210",
            "role": "rider",
            "otp": "123456"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
              "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }
          }
  - name: 401 Response
    description: Invalid or expired OTP
    request:
      url: "{{baseUrl}}/api/v1/auth/otp/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "phone": "+919876543210",
            "role": "rider",
            "otp": "123456"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "code": "TOO_MANY_REQUESTS",
              "message": "Rate limit exceeded. Try again after 10 minutes."
            }
          }

docs: Verifies the 6-digit OTP and generates a JWT access token and refresh token pair. Also upserts the user profile.

info:
  name: Refresh Access Token
  type: http
  seq: 3
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Token pair refreshed successfully
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
              "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }
          }
  - name: 401 Response
    description: Invalid or expired refresh token
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "code": "TOO_MANY_REQUESTS",
              "message": "Rate limit exceeded. Try again after 10 minutes."
            }
          }

docs: Issues a new access token and refresh token pair using a valid refresh token.

info:
  name: Admin Portal Login
  type: http
  seq: 4
  tags:
    - Authentication
    - Admin

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@naaride.com",
        "password": "supersecretadminpass"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Admin login successful
    request:
      url: "{{baseUrl}}/api/v1/admin/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@naaride.com",
            "password": "supersecretadminpass"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
              "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }
          }
  - name: 401 Response
    description: Invalid credentials
    request:
      url: "{{baseUrl}}/api/v1/admin/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@naaride.com",
            "password": "supersecretadminpass"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "code": "TOO_MANY_REQUESTS",
              "message": "Rate limit exceeded. Try again after 10 minutes."
            }
          }

docs: Authenticates admin users using email and password, returning a JWT token pair.

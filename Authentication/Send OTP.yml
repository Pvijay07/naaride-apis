info:
  name: Send OTP
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/otp/send"
  body:
    type: json
    data: |-
      {
        "phone": "+916303132973",
        "role": "rider"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OTP sent successfully
    request:
      url: "{{baseUrl}}/api/v1/auth/otp/send"
      method: POST
      body:
        type: json
        data: |-
          {
            "phone": "+919876543210",
            "role": "rider"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "message": "OTP sent successfully"
            }
          }
  - name: 429 Response
    description: Rate limit exceeded
    request:
      url: "{{baseUrl}}/api/v1/auth/otp/send"
      method: POST
      body:
        type: json
        data: |-
          {
            "phone": "+919876543210",
            "role": "rider"
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "code": "TOO_MANY_REQUESTS",
              "message": "Rate limit exceeded. Try again after 10 minutes."
            }
          }

docs: Generates and sends a 6-digit OTP to the provided phone number. Includes rate limiting (3 requests per 10 minutes).

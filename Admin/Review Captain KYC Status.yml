info:
  name: Review Captain KYC Status
  type: http
  seq: 2
  tags:
    - Admin

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/captains/:id/kyc"
  params:
    - name: id
      value: ""
      type: path
      description: UUID/ID of the captain
  body:
    type: json
    data: |-
      {
        "status": "approved",
        "reason": "Invalid document verification photo"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: baseUrl
      value: http://222.167.207.186:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Captain KYC status updated successfully
    request:
      url: "{{baseUrl}}/api/v1/admin/captains/:id/kyc"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
          description: UUID/ID of the captain
      body:
        type: json
        data: |-
          {
            "status": "approved",
            "reason": "Invalid document verification photo"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "",
              "kyc_status": "approved",
              "kyc_reject_reason": null
            }
          }

docs: Updates the KYC status of a captain (approved/rejected) with an optional reason.

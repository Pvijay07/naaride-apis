info:
  name: Get Admin Dashboard Metrics
  type: http
  seq: 1
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/dashboard/metrics"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: baseUrl
      value: http://222.167.207.186:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Dashboard metrics retrieved successfully
    request:
      url: "{{baseUrl}}/api/v1/admin/dashboard/metrics"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "active_riders": 104,
              "active_captains": 45,
              "total_rides_today": 320,
              "total_revenue_today": 45200
            }
          }

docs: Returns operational platform metrics like daily active riders/captains, total rides, and revenue.

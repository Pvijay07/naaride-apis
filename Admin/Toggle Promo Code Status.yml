info:
  name: Toggle Promo Code Status
  type: http
  seq: 5
  tags:
    - Admin

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/promo-codes/:id/toggle"
  params:
    - name: id
      value: ""
      type: path
      description: UUID of the promo code to toggle
  body:
    type: json
    data: |-
      {
        "active": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Promo status updated successfully
    request:
      url: "{{baseUrl}}/api/v1/admin/promo-codes/:id/toggle"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
          description: UUID of the promo code to toggle
      body:
        type: json
        data: |-
          {
            "active": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "",
              "active": false
            }
          }

docs: Enforces toggling activity status of a promo code on/off.

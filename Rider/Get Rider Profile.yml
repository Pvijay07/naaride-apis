info:
  name: Get Rider Profile
  type: http
  seq: 1
  tags:
    - Rider

http:
  method: GET
  url: "{{baseUrl}}/api/v1/rider/profile"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Profile retrieved successfully
    request:
      url: "{{baseUrl}}/api/v1/rider/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "7c34efbd-09d2-43fa-a690-bdcd98711cf2",
              "phone": "+919876543210",
              "name": "Jane Doe",
              "email": "jane.doe@example.com",
              "created_at": "2026-07-20T12:00:00Z",
              "updated_at": "2026-07-20T12:30:00Z"
            }
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/rider/profile"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Returns the profile data of the currently logged-in rider.
